[project]
name = "agentops-research-agent"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = [
    "agentops",
    "pydantic-ai>=1.90",
    "anthropic>=0.40",
    "httpx>=0.27",
    "feedparser>=6.0",
]

[tool.uv.sources]
agentops = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentops_research_agent"]

[tool.hatch.build.targets.wheel.force-include]
"src/agentops_research_agent/mock_arxiv/data" = "agentops_research_agent/mock_arxiv/data"

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "live: tests that hit real LLM/external APIs (excluded by default in CI)",
]
